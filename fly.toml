# Fly.io app config for the backend. Deployed from the repo root so the
# existing multi-stage Dockerfile (frontend build -> Python runtime) applies
# unchanged. The frontend it bakes in is an unused fallback here — the
# primary frontend is deployed separately to Vercel; see README.
app = "wallet-toman-tracker"
primary_region = "ams"

[build]

[env]
  WALLET_STATIC_DIR = "/app/static"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[mounts]]
  source = "wallet_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
